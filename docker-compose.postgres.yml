services:
  postgres:
    image: postgres:16-alpine
    container_name: oxe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oxe
      POSTGRES_PASSWORD: oxe
      POSTGRES_DB: oxe_dev
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oxe -d oxe_dev']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: oxe-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: oxe-minio
      MINIO_ROOT_PASSWORD: oxe-minio-secret
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
